services:
  digikey-mcp-vscode:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_MCP: false
        CREATE_VSCODE_USER: true
    image: digikey-mcp-vscode:latest
    container_name: digikey-mcp-devcontainer
    environment:
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - USE_SANDBOX=${USE_SANDBOX}
    env_file:
      - .env
    # Run as vscode user for devcontainer
    user: vscode
    # Mount local workspace for live development
    volumes:
      - .:/workspace
      - ./localhost-cert.pem:/workspace/localhost-cert.pem:ro
      - ./localhost-key.pem:/workspace/localhost-key.pem:ro
